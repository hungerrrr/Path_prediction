  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;streaming-path-demo&quot;&gt;
  &lt;style&gt;
    #streaming-path-demo { color: var(--foreground); }

    #streaming-path-demo .legend-line.alt { border-top-color:var(--viz-series-2); opacity:.55; }
    @media (max-width: 680px) {
      #streaming-path-demo .stage-grid, #streaming-path-demo .io-grid { grid-template-columns:1fr; }

        &lt;rect class=&quot;stage-bg&quot; x=&quot;0&quot; y=&quot;0&quot; width=&quot;640&quot; height=&quot;240&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;

      &lt;div id=&quot;spd-flow-4&quot; class=&quot;flow-step&quot;&gt;&lt;span class=&quot;flow-num&quot;&gt;4&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;flow-title&quot;&gt;路径模型推理&lt;/div&gt;&lt;div id=&quot;spd-flow-model&quot; class=&quot;flow-sub text-small&quot;&gt;A · 6 条候选路径&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

      &lt;div id=&quot;spd-flow-6&quot; class=&quot;flow-step&quot;&gt;&lt;span class=&quot;flow-num&quot;&gt;6&lt;/span&gt;&lt;div&gt;&lt;div class=&quot;flow-title&quot;&gt;跌倒风险融合&lt;/div&gt;&lt;div class=&quot;flow-sub text-small&quot;&gt;交给更大系统的下游模块&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;div class=&quot;io-grid&quot;&gt;
    &lt;section&gt;&lt;div class=&quot;io-title&quot;&gt;&lt;span&gt;当前流式输入&lt;/span&gt;&lt;span class=&quot;viz-badge&quot;&gt;PersonFrameData&lt;/span&gt;&lt;/div&gt;&lt;pre id=&quot;spd-input&quot; aria-label=&quot;当前输入JSON&quot;&gt;&lt;/pre&gt;&lt;/section&gt;
    &lt;section&gt;&lt;div class=&quot;io-title&quot;&gt;&lt;span&gt;当前流式输出&lt;/span&gt;&lt;span class=&quot;viz-badge&quot;&gt;PredictionResult&lt;/span&gt;&lt;/div&gt;&lt;pre id=&quot;spd-output&quot; aria-label=&quot;当前输出JSON&quot;&gt;&lt;/pre&gt;&lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;streaming-path-demo&#x27;);
      const $ = id =&gt; root.querySelector(&#x27;#&#x27; + id);
      const modelCfg = {
        gru: {label:&#x27;GRU&#x27;, candidates:1, latency:3.1, series:[&#x27;var(--viz-series-1)&#x27;]},
        eigen: {label:&#x27;A · EigenTransformer&#x27;, candidates:6, latency:4.0, series:[&#x27;var(--viz-series-1)&#x27;,&#x27;var(--viz-series-2)&#x27;,&#x27;var(--viz-series-3)&#x27;,&#x27;var(--viz-series-4)&#x27;,&#x27;var(--viz-series-5)&#x27;,&#x27;var(--viz-series-6)&#x27;]},
        diffusion: {label:&#x27;B · Leapfrog Diffusion&#x27;, candidates:6, latency:16.0, series:[&#x27;var(--viz-series-1)&#x27;,&#x27;var(--viz-series-2)&#x27;,&#x27;var(--viz-series-3)&#x27;,&#x27;var(--viz-series-4)&#x27;,&#x27;var(--viz-series-5)&#x27;,&#x27;var(--viz-series-6)&#x27;]}
      };
      let frame = 55, playing = false, timer = null, history = [];

      function positionAt(f, scenario) {
        const t = f - 55;
        if (scenario === &#x27;walk&#x27;) return {x:190 + t * 2.2, y:165 + Math.sin(f * .24) * 2, lean:0};
        if (scenario === &#x27;turn&#x27;) return {x:210 + t * 1.7, y:164 + Math.sin(t * .3) * Math.min(18, Math.max(0,t)), lean:Math.sin(t*.35)*.18};
        const fall = Math.max(0, t - 8);
        return {x:205 + t * 2.0 + fall * 1.8, y:164 + Math.min(42, fall * 5.3), lean:Math.min(1.15, fall * .14)};
      }

      function buildHistory() {
        history = [];
        const scenario = $(&#x27;spd-scenario&#x27;).value;
        for (let f = Math.max(1, frame - 54); f &lt;= frame; f++) history.push(positionAt(f, scenario));
      }

      function futurePaths(pos, scenario, count) {
        const paths = [];
        for (let k = 0; k &lt; count; k++) {
          const points = [];
          for (let i = 1; i &lt;= 18; i++) {
            const spread = count === 1 ? 0 : (k - (count - 1) / 2) * i * .26;
            let x = pos.x + i * 6.2;
            let y = pos.y + spread;
            if (scenario === &#x27;turn&#x27;) y += Math.sin(i / 6) * 24;
            if (scenario === &#x27;fall&#x27;) {
              x += i * 1.8;
              y += Math.min(48, i * 4.1) + spread * .35;
            }
            points.push([Math.min(632,x), Math.min(220,Math.max(10,y))]);
          }
          paths.push(points);
        }
        return paths;
      }

      function skeleton(pos) {
        const a = pos.lean, cx = pos.x, cy = pos.y;
        const hx = cx + Math.sin(a) * 42, hy = cy - Math.cos(a) * 42;
        $(&#x27;spd-head&#x27;).setAttribute(&#x27;cx&#x27;, hx); $(&#x27;spd-head&#x27;).setAttribute(&#x27;cy&#x27;, hy);
        const shoulderX = cx + Math.sin(a) * 24, shoulderY = cy - Math.cos(a) * 24;
        const leftHand = [shoulderX - 22*Math.cos(a), shoulderY + 18*Math.sin(a)];
        const rightHand = [shoulderX + 22*Math.cos(a), shoulderY - 18*Math.sin(a)];
        const leftFoot = [cx - 15*Math.cos(a), Math.min(220,cy + 42*Math.cos(a))];
        const rightFoot = [cx + 15*Math.cos(a), Math.min(220,cy + 42*Math.cos(a))];
        $(&#x27;spd-body&#x27;).setAttribute(&#x27;d&#x27;, `M${hx} ${hy+10}L${cx} ${cy}M${shoulderX} ${shoulderY}L${leftHand[0]} ${leftHand[1]}M${shoulderX} ${shoulderY}L${rightHand[0]} ${rightHand[1]}M${cx} ${cy}L${leftFoot[0]} ${leftFoot[1]}M${cx} ${cy}L${rightFoot[0]} ${rightFoot[1]}`);
        $(&#x27;spd-center&#x27;).setAttribute(&#x27;cx&#x27;,cx); $(&#x27;spd-center&#x27;).setAttribute(&#x27;cy&#x27;,cy);
        $(&#x27;spd-actual&#x27;).setAttribute(&#x27;cx&#x27;,cx); $(&#x27;spd-actual&#x27;).setAttribute(&#x27;cy&#x27;,cy);
      }

      function renderBuffer() {
        const count = Math.min(60, frame);
        $(&#x27;spd-buffer&#x27;).innerHTML = Array.from({length:60}, (_,i)=&gt;`&lt;span class=&quot;buffer-cell ${i&lt;count?&#x27;filled&#x27;:&#x27;&#x27;}&quot;&gt;&lt;/span&gt;`).join(&#x27;&#x27;);
        $(&#x27;spd-buffer-label&#x27;).textContent = `${count} / 60 帧`;
        $(&#x27;spd-frame&#x27;).textContent = `${frame} / ${count}·60`;
      }

      function render() {
        const scenario = $(&#x27;spd-scenario&#x27;).value, model = modelCfg[$(&#x27;spd-model&#x27;).value];
        buildHistory();
        const pos = history[history.length-1], ready = frame &gt;= 60;
        skeleton(pos);
        $(&#x27;spd-tail&#x27;).setAttribute(&#x27;points&#x27;, history.map(p=&gt;`${p.x},${p.y}`).join(&#x27; &#x27;));
        renderBuffer();
        $(&#x27;spd-flow-model&#x27;).textContent = `${model.label} · ${model.candidates} 条候选路径`;
        const paths = ready ? futurePaths(pos, scenario, model.candidates) : [];
        const pathGroup = $(&#x27;spd-paths&#x27;); pathGroup.innerHTML = &#x27;&#x27;;
        paths.forEach((pts,k)=&gt;{
          const line=document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;,&#x27;polyline&#x27;);
          line.setAttribute(&#x27;points&#x27;,pts.map(p=&gt;p.join(&#x27;,&#x27;)).join(&#x27; &#x27;));
          line.setAttribute(&#x27;class&#x27;,&#x27;candidate &#x27;+(k===0?&#x27;top&#x27;:&#x27;&#x27;));
          line.setAttribute(&#x27;stroke&#x27;,model.series[k % model.series.length]);
          pathGroup.appendChild(line);
        });
        if (ready &amp;&amp; paths.length) {
          const all=paths.flat(), xs=all.map(p=&gt;p[0]), ys=all.map(p=&gt;p[1]);
          const l=Math.max(0,Math.min(...xs)-28), r=Math.min(639,Math.max(...xs)+28), t=Math.max(0,Math.min(...ys)-40), b=Math.min(239,Math.max(...ys)+40);
          $(&#x27;spd-corridor&#x27;).setAttribute(&#x27;points&#x27;,`${l},${t} ${r},${t} ${r},${b} ${l},${b}`);
        } else $(&#x27;spd-corridor&#x27;).setAttribute(&#x27;points&#x27;,&#x27;&#x27;);

        const phase = !ready ? 3 : 6;
        for(let i=1;i&lt;=6;i++) $(&#x27;spd-flow-&#x27;+i).classList.toggle(&#x27;active&#x27;,i&lt;=phase);
        $(&#x27;spd-status&#x27;).textContent = ready ? `${model.candidates} 条候选` : &#x27;积累中&#x27;;
        $(&#x27;spd-latency&#x27;).textContent = ready ? `模拟单人推理 ${model.latency.toFixed(1)} ms` : `还需 ${60-frame} 帧`;
        const fallProgress = scenario===&#x27;fall&#x27; ? Math.max(0,frame-63) : 0;
        const risk = ready ? Math.min(96, scenario===&#x27;walk&#x27;?12:scenario===&#x27;turn&#x27;?46:28+fallProgress*9) : 0;
        $(&#x27;spd-risk&#x27;).textContent = ready ? `${risk}% · ${risk&gt;=70?&#x27;高风险&#x27;:risk&gt;=35?&#x27;关注&#x27;:&#x27;低风险&#x27;}` : &#x27;等待&#x27;;
        $(&#x27;spd-risk&#x27;).className = &#x27;viz-stat-value &#x27; + (risk&gt;=70?&#x27;risk-high&#x27;:&#x27;risk-low&#x27;);
        $(&#x27;spd-risk-detail&#x27;).textContent = ready ? (risk&gt;=70?&#x27;未来路径快速下沉并前移&#x27;:&#x27;融合轨迹速度、方向与姿态&#x27;) : &#x27;需要有效未来轨迹&#x27;;

        const keypoints={nose:[+pos.x.toFixed(1),+(pos.y-42).toFixed(1)],midhip:[+pos.x.toFixed(1),+pos.y.toFixed(1)],rankle:[+(pos.x+15).toFixed(1),+Math.min(220,pos.y+42).toFixed(1)],lankle:[+(pos.x-15).toFixed(1),+Math.min(220,pos.y+42).toFixed(1)]};
        $(&#x27;spd-input&#x27;).textContent=JSON.stringify({frame_id:frame,timestamp:+(frame/30).toFixed(3),person_id:&#x27;camera_01:elder_01&#x27;,keypoints,bbox:[+(pos.x-35).toFixed(1),+(pos.y-65).toFixed(1),+(pos.x+35).toFixed(1),+Math.min(225,pos.y+48).toFixed(1)],detection_confidence:0.95},null,2);
        const output={frame_id:frame,person_id:&#x27;camera_01:elder_01&#x27;,has_prediction:ready,current_position:[+pos.x.toFixed(1),+pos.y.toFixed(1)],predicted_path:ready?paths[0].slice(0,3).map(p=&gt;p.map(v=&gt;+v.toFixed(1))):[],candidate_count:ready?model.candidates:0,confidence:ready?+(model.candidates===1?.876:.848).toFixed(3):0,path_corridor:ready?&#x27;4 corner points&#x27;:&#x27;&#x27;,model_method:$(&#x27;spd-model&#x27;).value};
        $(&#x27;spd-output&#x27;).textContent=JSON.stringify(output,null,2)+(ready?String.fromCharCode(10)+&#x27;… predicted_path 共 90 个点&#x27;:&#x27;&#x27;);
      }

      function tick(){ frame++; if(frame&gt;78) frame=1; render(); }
      function stop(){ playing=false; clearInterval(timer); timer=null; $(&#x27;spd-play&#x27;).textContent=&#x27;开始流式输入&#x27;; }
      $(&#x27;spd-play&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{ if(playing){stop();return;} playing=true; $(&#x27;spd-play&#x27;).textContent=&#x27;暂停&#x27;; timer=setInterval(tick,180); });
      $(&#x27;spd-step&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{ stop(); tick(); });
      $(&#x27;spd-reset&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{ stop(); frame=55; render(); });
      $(&#x27;spd-model&#x27;).addEventListener(&#x27;change&#x27;,render);
      $(&#x27;spd-scenario&#x27;).addEventListener(&#x27;change&#x27;,()=&gt;{ frame=55; render(); });
      render();
    })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
